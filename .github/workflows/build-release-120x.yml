name: Build release for 1.20.x

on:
  push:
    branches:
      - 1.20.x
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      next_version: ${{ steps.matrix.outputs.next_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import datetime
          import json
          import os
          import pathlib

          matrix_path = pathlib.Path('.github/release-matrix.json')
          data = json.loads(matrix_path.read_text(encoding='utf-8'))

          next_version = datetime.datetime.utcnow().strftime('%y%m%d')

          rows = []
          for release in data['releases']:
              series = release['series']
              if series != '1.20.x':
                  continue
              java_version = '17'

              for loader in release['loaders']:
                  filename = data['filename'].format(
                      loader=loader,
                      series=series,
                      program=next_version,
                  )
                  rows.append({
                      'series': series,
                      'program': next_version,
                      'loader': loader,
                      'java': java_version,
                      'filename': filename,
                  })

          if not rows:
              raise SystemExit('No 1.20.x releases configured in .github/release-matrix.json')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"matrix={json.dumps(rows)}\n")
              fh.write(f"next_version={next_version}\n")
          PY

          echo "Prepared 1.20.x release matrix"

  build:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/settings.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Gradle wrapper permission
        shell: bash
        run: |
          chmod +x gradlew
          if [ -f forge/gradlew ]; then chmod +x forge/gradlew; fi
          if [ -f neoforge/gradlew ]; then chmod +x neoforge/gradlew; fi

      - name: Build jar for ${{ matrix.loader }} / ${{ matrix.series }}
        shell: bash
        run: |
          set -euo pipefail

          root_dir="$GITHUB_WORKSPACE"
          mkdir -p "$root_dir/dist"

          case "${{ matrix.loader }}" in
            fabric)
              ./gradlew --no-daemon --max-workers=1 -Pmod_version="${{ matrix.program }}" assemble
              build_dir="$root_dir"
              ;;
            forge)
              cd "$root_dir/forge"
              ./gradlew --no-daemon --max-workers=1 -Pmod_version="${{ matrix.program }}" assemble
              build_dir="$root_dir/forge"
              ;;
            neoforge)
              cd "$root_dir/neoforge"
              ./gradlew --no-daemon --max-workers=1 -Pmod_version="${{ matrix.program }}" assemble
              build_dir="$root_dir/neoforge"
              ;;
            *)
              echo "Unsupported loader: ${{ matrix.loader }}"
              exit 1
              ;;
          esac

          shopt -s nullglob
          jar_candidates=("$build_dir"/build/libs/*.jar)
          filtered=()
          for jar in "${jar_candidates[@]}"; do
            name="$(basename "$jar")"
            if [[ "$name" == *"-sources.jar" || "$name" == *"-javadoc.jar" || "$name" == *"-dev.jar" ]]; then
              continue
            fi
            filtered+=("$jar")
          done

          selected_jar=""
          if [[ "${{ matrix.loader }}" == "forge" || "${{ matrix.loader }}" == "neoforge" ]]; then
            for jar in "${filtered[@]}"; do
              if [[ "$jar" == *"-all.jar" ]]; then
                selected_jar="$jar"
                break
              fi
            done
          else
            for jar in "${filtered[@]}"; do
              if [[ "$jar" != *"-all.jar" ]]; then
                selected_jar="$jar"
                break
              fi
            done
          fi

          if [[ -z "$selected_jar" && ${#filtered[@]} -gt 0 ]]; then
            selected_jar="${filtered[0]}"
          fi

          if [[ -n "$selected_jar" ]]; then
            cp "$selected_jar" "$root_dir/dist/${{ matrix.filename }}"
            echo "Selected artifact: $selected_jar"
          fi

          if [ ! -f "$root_dir/dist/${{ matrix.filename }}" ]; then
            echo "Failed to locate built jar for ${{ matrix.filename }}" >&2
            exit 1
          fi

      - name: Upload built jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: dist/${{ matrix.filename }}

  publish:
    needs:
      - prepare-matrix
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all built jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ needs.prepare-matrix.outputs.next_version }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys

          dist_dir = pathlib.Path('dist')
          jar_files = sorted(dist_dir.glob('*.jar'))
          if not jar_files:
              print('No jar files were found in dist/ to upload', file=sys.stderr)
              sys.exit(1)

          pattern = re.compile(r'^ChineseBridge-[^-]+-(?P<series>\d+\.\d+\.x)-(?P<program>\d+)\.jar$')
          grouped = {}
          series_program = {}
          for jar in jar_files:
              match = pattern.match(jar.name)
              if not match:
                  print(f'Unexpected jar filename format: {jar.name}', file=sys.stderr)
                  sys.exit(1)
              series = match.group('series')
              program = match.group('program')
              grouped.setdefault(series, []).append(jar)
              series_program.setdefault(series, set()).add(program)

          next_version = os.environ.get('NEXT_VERSION', '').strip() or 'unknown'
          commit_subject = subprocess.check_output(['git', 'log', '-1', '--pretty=%s'], text=True).strip()
          commit_hash = subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD'], text=True).strip()
          commit_full = os.environ.get('GITHUB_SHA', '').strip() or 'HEAD'

          for series in sorted(grouped.keys()):
              release_tag = f'{series}-Release'
              release_title = f'Minecraft {series}'
              programs = series_program.get(series, set())
              if len(programs) != 1:
                  print(f'Expected a single program per series, got {sorted(programs)} for {series}', file=sys.stderr)
                  sys.exit(1)

              notes = commit_subject

              exists = subprocess.run(
                  ['gh', 'release', 'view', release_tag],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0

              # Move tag to latest commit so release commit and publish time are refreshed.
              subprocess.check_call(['git', 'tag', '-f', release_tag, commit_full])
              subprocess.check_call(['git', 'push', 'origin', f'refs/tags/{release_tag}', '--force'])

              if exists:
                  print(f'Recreating release {release_tag} to refresh publish timestamp')
                  subprocess.check_call(['gh', 'release', 'delete', release_tag, '--yes'])

              subprocess.check_call([
                  'gh', 'release', 'create',
                  release_tag,
                  '--target', commit_full,
                  '--title', release_title,
                  '--notes', notes,
              ])

              files = [str(path) for path in grouped[series]]
              print(f'Uploading jars to {release_tag}:')
              for path in files:
                  print(f' - {path}')

              subprocess.check_call(['gh', 'release', 'upload', release_tag, *files, '--clobber'])
          PY
