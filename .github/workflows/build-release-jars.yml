name: Build release jars

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      next_version: ${{ steps.matrix.outputs.next_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import pathlib
          import re

          matrix_path = pathlib.Path('.github/release-matrix.json')
          data = json.loads(matrix_path.read_text(encoding='utf-8'))

          gradle_props_path = pathlib.Path('gradle.properties')
          props_text = gradle_props_path.read_text(encoding='utf-8')
          match = re.search(r'^mod_version\s*=\s*(\d+)', props_text, re.M)
          if not match:
              raise SystemExit('mod_version not found in gradle.properties')

          current_version = match.group(1)
          next_version = str(int(current_version) + 1).zfill(len(current_version))

          rows = []
          for release in data['releases']:
              series = release['series']
              java_version = '17' if series.startswith('1.20') else '21'

              for loader in release['loaders']:
                  filename = data['filename'].format(
                      loader=loader,
                      series=series,
                      program=next_version,
                  )
                  rows.append({
                      'series': series,
                      'program': next_version,
                      'loader': loader,
                      'minecraft_range': release['minecraft_range'],
                      'java': java_version,
                      'filename': filename,
                  })

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"matrix={json.dumps(rows)}\n")
              fh.write(f"next_version={next_version}\n")
          PY

          if [ -n "${next_version:-}" ]; then
            echo "Using version ${next_version} for this build"
          else
            echo "Using version from gradle.properties"
          fi

  build:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/settings.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Gradle wrapper permission
        shell: bash
        run: |
          chmod +x gradlew
          if [ -f forge/gradlew ]; then chmod +x forge/gradlew; fi
          if [ -f neoforge/gradlew ]; then chmod +x neoforge/gradlew; fi

      - name: Build jar for ${{ matrix.loader }} / ${{ matrix.series }}
        shell: bash
        run: |
          set -euo pipefail

          root_dir="$GITHUB_WORKSPACE"
          mkdir -p "$root_dir/dist"

          case "${{ matrix.loader }}" in
            fabric)
              ./gradlew --no-daemon --max-workers=1 -Pmod_version="${{ matrix.program }}" assemble
              build_dir="$root_dir"
              ;;
            forge)
              cd "$root_dir/forge"
              ./gradlew --no-daemon --max-workers=1 -Pmod_version="${{ matrix.program }}" assemble
              build_dir="$root_dir/forge"
              ;;
            neoforge)
              cd "$root_dir/neoforge"
              ./gradlew --no-daemon --max-workers=1 -Pmod_version="${{ matrix.program }}" assemble
              build_dir="$root_dir/neoforge"
              ;;
            *)
              echo "Unsupported loader: ${{ matrix.loader }}"
              exit 1
              ;;
          esac

          find "$build_dir" -type f -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*-dev.jar' \
            | while read -r jar; do
                if [[ "$jar" != *"sources"* && "$jar" != *"javadoc"* && "$jar" != *"dev"* ]]; then
                  cp "$jar" "$root_dir/dist/${{ matrix.filename }}"
                  break
                fi
              done

          if [ ! -f "$root_dir/dist/${{ matrix.filename }}" ]; then
            echo "Failed to locate built jar for ${{ matrix.filename }}" >&2
            exit 1
          fi

      - name: Upload built jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: dist/${{ matrix.filename }}

  publish:
    needs:
      - prepare-matrix
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all built jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ needs.prepare-matrix.outputs.next_version }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys

          dist_dir = pathlib.Path('dist')
          jar_files = sorted(dist_dir.glob('*.jar'))
          if not jar_files:
              print('No jar files were found in dist/ to upload', file=sys.stderr)
              sys.exit(1)

          pattern = re.compile(r'^ChineseBridge-[^-]+-(?P<series>\d+\.\d+\.x)-(?P<program>\d+)\.jar$')
          grouped = {}
          for jar in jar_files:
              match = pattern.match(jar.name)
              if not match:
                  print(f'Unexpected jar filename format: {jar.name}', file=sys.stderr)
                  sys.exit(1)
              series = match.group('series')
              grouped.setdefault(series, []).append(jar)

          next_version = os.environ.get('NEXT_VERSION', '').strip() or 'unknown'

          for series in sorted(grouped.keys()):
              release_tag = series
              release_title = f'Minecraft {series}'
              notes = f'Automated builds from main (program {next_version})'

              exists = subprocess.run(
                  ['gh', 'release', 'view', release_tag],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0

              if exists:
                  print(f'Release {release_tag} already exists')
              else:
                  subprocess.check_call([
                      'gh', 'release', 'create',
                      release_tag,
                      '--title', release_title,
                      '--notes', notes,
                  ])

              files = [str(path) for path in grouped[series]]
              print(f'Uploading jars to {release_tag}:')
              for path in files:
                  print(f' - {path}')

              subprocess.check_call(['gh', 'release', 'upload', release_tag, *files, '--clobber'])
          PY
