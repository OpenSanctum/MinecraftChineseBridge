name: ci-and-release

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Make gradle wrappers executable
        run: chmod +x ./gradlew ./forge/gradlew ./neoforge/gradlew

      - name: Build Fabric
        run: ./gradlew build

      - name: Build Forge
        working-directory: forge
        run: ./gradlew build

      - name: Build NeoForge
        working-directory: neoforge
        run: ./gradlew build

      - name: Capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            build/libs/
            forge/build/libs/
            neoforge/build/libs/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Setup Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read current and previous program version
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          current_program="$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
          previous_program="$(jq -r '.releases[0].program // ""' .github/release-matrix.json)"

          echo "current_program=$current_program" >> "$GITHUB_OUTPUT"
          echo "previous_program=$previous_program" >> "$GITHUB_OUTPUT"

      - name: Sync release matrix to current program
        shell: bash
        run: |
          set -euo pipefail
          current_program="${{ steps.versions.outputs.current_program }}"

          tmp_file="$(mktemp)"
          jq --arg p "$current_program" '.releases |= map(.program = $p)' .github/release-matrix.json > "$tmp_file"
          mv "$tmp_file" .github/release-matrix.json

      - name: Auto-commit release matrix changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/release-matrix.json; then
            echo "release-matrix.json is already up to date"
            exit 0
          fi

          git add .github/release-matrix.json
          git commit -m "chore(release): sync release matrix to ${{ steps.versions.outputs.current_program }} [skip ci]"
          git push origin HEAD:main

      - name: Refresh local main after potential auto-commit
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build Fabric
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Build Forge
        run: |
          chmod +x ./forge/gradlew
          cd forge
          ./gradlew build

      - name: Build NeoForge
        run: |
          chmod +x ./neoforge/gradlew
          cd neoforge
          ./gradlew build

      - name: Prepare release assets by series
        id: assets
        shell: bash
        run: |
          set -euo pipefail

          program="${{ steps.versions.outputs.current_program }}"
          mkdir -p dist

          pick_jar() {
            local dir="$1"
            find "$dir" -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-shadow.jar' \
              | sort | head -n 1
          }

          fabric_jar="$(pick_jar build/libs)"
          forge_jar="$(pick_jar forge/build/libs)"
          neoforge_jar="$(pick_jar neoforge/build/libs)"

          test -n "$fabric_jar"
          test -n "$forge_jar"
          test -n "$neoforge_jar"

          jq -r '.releases[].series' .github/release-matrix.json | while read -r series; do
            cp "$fabric_jar" "dist/ChineseBridge-fabric-${series}-${program}.jar"
            cp "$forge_jar" "dist/ChineseBridge-forge-${series}-${program}.jar"
            cp "$neoforge_jar" "dist/ChineseBridge-neoforge-${series}-${program}.jar"
          done

          echo "program=$program" >> "$GITHUB_OUTPUT"

      - name: Push release tags
        shell: bash
        run: |
          set -euo pipefail
          program="${{ steps.assets.outputs.program }}"

          git tag -f "$program"
          git push --force origin "refs/tags/$program"

          jq -r '.releases[].series' .github/release-matrix.json | while read -r series; do
            git tag -f "$series"
            git push --force origin "refs/tags/$series"
          done

      - name: Delete previous program release and tag
        if: steps.versions.outputs.previous_program != '' && steps.versions.outputs.previous_program != steps.versions.outputs.current_program
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous="${{ steps.versions.outputs.previous_program }}"

          gh release delete "$previous" -y || true
          git push origin ":refs/tags/$previous" || true

      - name: Recreate program release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          program="${{ steps.assets.outputs.program }}"

          gh release delete "$program" -y || true
          gh release create "$program" dist/*.jar \
            --title "$program" \
            --notes "Automated release for program $program"

      - name: Recreate series releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          program="${{ steps.assets.outputs.program }}"

          jq -r '.releases[].series' .github/release-matrix.json | while read -r series; do
            gh release delete "$series" -y || true
            gh release create "$series" "dist/ChineseBridge-fabric-${series}-${program}.jar" "dist/ChineseBridge-forge-${series}-${program}.jar" "dist/ChineseBridge-neoforge-${series}-${program}.jar" \
              --title "$series" \
              --notes "Automated series release $series (program $program)"
          done
